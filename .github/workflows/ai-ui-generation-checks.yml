name: AI UI Generation Checks

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  ai-ui-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: WHartTest_Vue/package-lock.json

      - name: Install Django dependencies
        working-directory: WHartTest_Django
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -r requirements.txt

      - name: Install actuator dependencies
        working-directory: WHartTest_Actuator
        run: uv sync

      - name: Install Vue dependencies
        working-directory: WHartTest_Vue
        run: npm ci

      - name: Run AI UI generation checks
        run: bash scripts/check_ai_ui_generation.sh
